<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Guácharo Activo</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Guácharo Activo</h1>
            <p>Sistema de Cálculo: Pirámide & Ley de Atracción</p>
        </header>

        <main class="card">
            <div class="input-grid">
                <div class="input-group">
                    <label for="fechaInput">Fecha del Sorteo</label>
                    <input type="date" id="fechaInput">
                </div>

                <div class="input-group">
                    <label for="horaInput">Próximo Sorteo</label>
                    <select id="horaInput">
                        <option value="08:00 AM">08:00 AM</option>
                        <option value="09:00 AM">09:00 AM</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="11:00 AM">11:00 AM</option>
                        <option value="12:00 PM">12:00 PM</option>
                        <option value="01:00 PM" selected>01:00 PM</option>
                        <option value="02:00 PM">02:00 PM</option>
                        <option value="03:00 PM">03:00 PM</option>
                        <option value="04:00 PM">04:00 PM</option>
                        <option value="05:00 PM">05:00 PM</option>
                        <option value="06:00 PM">06:00 PM</option>
                        <option value="07:00 PM">07:00 PM</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="anteriorInput">Resultado Anterior (Animalito / Número 00-75)</label>
                <input type="text" id="anteriorInput" placeholder="Ej. 23" maxlength="2" autocomplete="off">
            </div>

            <button id="calcularBtn" class="primary-btn">Generar Pronóstico</button>
        </main>

        <section id="resultados" class="results-container hidden">
            <div class="result-card">
                <h3>Método de la Pirámide</h3>
                <div id="piramideOutput" class="pyramid-box"></div>
                <p id="reduccionFinal" class="pyramid-footer"></p>
            </div>

            <div class="result-card">
                <h3>Ley de Atracción / Jaladera</h3>
                <ul id="atraccionList" class="attraction-list"></ul>
            </div>

            <div class="result-card highlight-card">
                <h3>Selección Final — <span id="lblHoraSorteo"></span></h3>
                <div id="finalOutput" class="final-badge"></div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
