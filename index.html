<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Guácharo Activo - Pirámide y Atracción</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Guácharo Activo</h1>
        <p class="subtitle">Método de la Pirámide y Ley de Atracción</p>

        <div class="card">
            <div class="input-group">
                <label for="fechaInput">Fecha del Sorteo:</label>
                <input type="date" id="fechaInput">
            </div>

            <div class="input-group">
                <label for="horaInput">Próximo Sorteo (Hora):</label>
                <select id="horaInput">
                    <option value="09:00 AM">09:00 AM</option>
                    <option value="10:00 AM">10:00 AM</option>
                    <option value="11:00 AM">11:00 AM</option>
                    <option value="12:00 PM">12:00 PM</option>
                    <option value="01:00 PM" selected>01:00 PM</option>
                    <option value="03:00 PM">03:00 PM</option>
                    <option value="04:00 PM">04:00 PM</option>
                    <option value="05:00 PM">05:00 PM</option>
                    <option value="06:00 PM">06:00 PM</option>
                    <option value="07:00 PM">07:00 PM</option>
                </select>
            </div>

            <div class="input-group">
                <label for="anteriorInput">Resultado Anterior (Ej: 23):</label>
                <input type="text" id="anteriorInput" placeholder="Ej. 23" maxlength="2">
            </div>

            <button id="calcularBtn">Calcular Pronóstico</button>
        </div>

        <div id="resultados" class="results-container hidden">
            <div class="section">
                <h3>Resultado de la Pirámide</h3>
                <div id="piramideOutput" class="pyramid-box"></div>
                <p id="reduccionFinal" class="highlight-text"></p>
            </div>

            <div class="section">
                <h3>Ley de Atracción / Jaladera</h3>
                <ul id="atraccionList" class="attraction-list"></ul>
            </div>

            <div class="section final-pick">
                <h3>Selección Final para las <span id="lblHoraSorteo"></span></h3>
                <div id="finalOutput" class="final-badge"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
