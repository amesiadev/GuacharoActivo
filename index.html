<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador Lotto Activo & Granjita</title>
    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h1>🐎 Auditor Lotto & Granjita (N=38)</h1>
    
    <div class="panel">
        <div class="upload-group">
            <div class="upload-box">
                <p>1. Sube el CSV de <b>Lotto Activo</b></p>
                <label for="lottoFile" class="btn" style="display:block; text-align:center; padding: 8px; cursor:pointer;">Seleccionar Archivo</label>
                <input type="file" id="lottoFile" accept=".csv">
                <p id="lottoStatus" style="font-size: 0.8rem; color: #8b949e;">Sin archivo</p>
            </div>
            <div class="upload-box">
                <p>2. Sube el CSV de <b>La Granjita</b></p>
                <label for="granjitaFile" class="btn" style="display:block; text-align:center; padding: 8px; cursor:pointer;">Seleccionar Archivo</label>
                <input type="file" id="granjitaFile" accept=".csv">
                <p id="granjitaStatus" style="font-size: 0.8rem; color: #8b949e;">Sin archivo</p>
            </div>
        </div>

        <div class="date-inputs">
            <label>Fecha Espejo (Mes Anterior):</label>
            <input type="date" id="mirrorDate" value="2026-10-20">
        </div>

        <button class="btn" id="analyzeBtn" disabled>Analizar y Generar Top 4</button>
        <p id="errorMsg" class="error hidden"></p>
    </div>

    <div id="results" class="hidden">
        <div class="results-grid">
            <!-- Lotto Activo -->
            <div class="card">
                <h3>Top 4 Lotto Activo</h3>
                <div id="lottoTop4"></div>
            </div>
            
            <!-- La Granjita -->
            <div class="card">
                <h3>Top 4 La Granjita</h3>
                <div id="granjitaTop4"></div>
            </div>
        </div>

        <!-- Cruce Oro -->
        <div class="oro-box">
            <h2>✨ Candidatos Oro (En ambos Top 4) ✨</h2>
            <div id="goldCandidates" style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap;"></div>
        </div>
    </div>
</div>

<!-- Enlace al archivo JavaScript -->
<script src="script.js"></script>
</body>
</html>
